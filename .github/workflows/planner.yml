name: planner-agent
on:
  issues:
    types: [labeled]

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: planner-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event.label.name == 'agent:needs-plan'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - id: claude
        uses: anthropics/claude-code-action@v1
        continue-on-error: true
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            prompts/planner.md dosyasındaki talimatları uygula.
            Issue: #${{ github.event.issue.number }}
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Grep,Glob,Write,Bash(gh issue view:*),Bash(gh issue comment:*)"

      - name: Transcript'i artifact olarak yükle
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: planner-transcript-${{ github.run_id }}
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 30

      - name: Label geçişi (state machine)
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.claude.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # İçerik-tabanlı geçiş: state'i süreç exit code'u değil, üretilen
        # artefakt belirler. Plan comment'i varsa koşu max-turns'e takılmış
        # olsa bile plan geçerlidir.
        run: |
          last_comment=$(gh issue view "$ISSUE" --json comments --jq '.comments[-1].body' || echo "")
          first_line=$(printf '%s' "$last_comment" | head -1)
          if [ "$first_line" = "## Agent Plan" ]; then
            gh issue edit "$ISSUE" --remove-label agent:needs-plan --add-label agent:plan-ready
          else
            gh issue edit "$ISSUE" --remove-label agent:needs-plan --add-label agent:blocked
            if [ "$first_line" != "## Agent Blocked" ]; then
              gh issue comment "$ISSUE" --body "## Agent Blocked

          Planner plan üretemedi (outcome: $OUTCOME). Log: $RUN_URL"
            fi
          fi
