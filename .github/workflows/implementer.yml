name: implementer-agent
on:
  issues:
    types: [labeled]

# Not: AGENT_GITHUB_PAT secret'ı, agent'ın push/PR'ının diğer workflow'ları
# (ci, reviewer) tetikleyebilmesi için gerekir. Varsayılan github.token ile
# yapılan push/PR, GitHub'ın recursion koruması nedeniyle event tetiklemez.
permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: implementer-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.label.name == 'agent:plan-approved'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: in-progress işaretle
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE" --add-label agent:in-progress

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AGENT_GITHUB_PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - id: claude
        uses: anthropics/claude-code-action@v1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_PAT || github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            prompts/implementer.md dosyasındaki talimatları uygula.
            Issue: #${{ github.event.issue.number }}
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git branch:*),Bash(git checkout:*),Bash(git switch:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(pip install:*),Bash(pytest:*),Bash(ruff:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*)"

      - name: Transcript'i artifact olarak yükle
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: implementer-transcript-${{ github.run_id }}
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 30

      - name: Label geçişi (state machine)
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.claude.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pr_count=$(gh pr list --head "agent/issue-$ISSUE" --state open --json number --jq 'length')
          if [ "$OUTCOME" = "success" ] && [ "$pr_count" -gt 0 ]; then
            gh issue edit "$ISSUE" \
              --remove-label agent:plan-approved --remove-label agent:in-progress \
              --add-label agent:needs-review
          else
            gh issue edit "$ISSUE" \
              --remove-label agent:in-progress \
              --add-label agent:blocked
            gh issue comment "$ISSUE" --body "## Agent Blocked

          Implementer koşusu PR üretemedi (outcome: $OUTCOME, açık PR: $pr_count). Log: $RUN_URL"
          fi
